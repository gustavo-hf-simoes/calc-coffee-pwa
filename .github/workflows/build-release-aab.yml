name: Build Signed Android AAB (Google Play Release)

on:
  workflow_dispatch:
    inputs:
      version_code_override:
        description: "Opcional: sobrescrever versionCode manualmente (inteiro positivo). Em branco usa offset + github.run_number."
        required: false
        type: string
      version_code_offset:
        description: "Offset somado ao github.run_number para versionCode monotônico (padrão: 0)."
        required: false
        default: "0"
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: android-release-aab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-aab:
    name: Build Signed Release AAB (API 36)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Required Signing Secrets (Fail-Fast)
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          missing=""
          [ "$HAS_KEYSTORE" != "true" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ "$HAS_STORE_PASS" != "true" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ "$HAS_KEY_ALIAS" != "true" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ "$HAS_KEY_PASS" != "true" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Secrets obrigatórios ausentes no repositório GitHub:$missing"
            echo "Configure em Settings -> Secrets and variables -> Actions -> Repository secrets."
            exit 1
          fi
          echo "Todos os secrets de assinatura estão configurados."

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21 (Capacitor 8 / API 36)
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Test Suite
        run: npm test

      - name: Resolve Version Metadata (Automatic Monotonic versionCode)
        id: version
        env:
          OVERRIDE_CODE: ${{ inputs.version_code_override }}
          OFFSET_CODE: ${{ inputs.version_code_offset || '0' }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          OFFSET_NUM="${OFFSET_CODE:-0}"
          if ! echo "$OFFSET_NUM" | grep -Eq '^[0-9]+$'; then
            echo "::error::version_code_offset inválido: $OFFSET_NUM"
            exit 1
          fi

          if [ -n "$OVERRIDE_CODE" ]; then
            VERSION_CODE="$OVERRIDE_CODE"
          else
            VERSION_CODE=$(( OFFSET_NUM + RUN_NUMBER ))
          fi

          if ! echo "$VERSION_CODE" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error::versionCode inválido calculado: $VERSION_CODE"
            exit 1
          fi

          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Release alvo: Calc Coffee v$APP_VERSION (versionCode=$VERSION_CODE)"

      - name: Prepare Web Assets (www)
        run: npm run build:web

      - name: Generate Native Android Project & Icons (Capacitor 8 / API 36)
        run: |
          npx cap add android
          npm run assets:native
          npx cap sync android

      - name: Configure Android Release (API 36 Check + VersionCode + Hardening)
        env:
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.app_version }}
        run: npm run android:configure

      - name: Decode Upload Keystore into Isolated Runner Temp
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/calc-coffee-upload.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build Signed Release AAB via Gradle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Verify Cryptographic AAB Signature
        run: |
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "::error::AAB não encontrado em $AAB_PATH"
            exit 1
          fi
          VERIFY_OUTPUT=$(jarsigner -verify "$AAB_PATH" 2>&1)
          echo "$VERIFY_OUTPUT"
          if ! echo "$VERIFY_OUTPUT" | grep -q "jar verified."; then
            echo "::error::O arquivo AAB não está criptograficamente assinado!"
            exit 1
          fi
          ls -lh "$AAB_PATH"

      - name: Upload Signed AAB Artifact (Google Play Ready)
        uses: actions/upload-artifact@v4
        with:
          name: calc-coffee-v${{ steps.version.outputs.app_version }}-code-${{ steps.version.outputs.version_code }}-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      - name: Cleanup Keystore from Runner Temp
        if: always()
        run: |
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ] && [ -f "$ANDROID_KEYSTORE_PATH" ]; then
            rm -f "$ANDROID_KEYSTORE_PATH"
          fi
