name: Build Android APK (Calc Coffee Staging)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK (API 36)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21 (Capacitor 8 / API 36)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - name: Install Dependencies
        run: npm ci

      - name: Validate Unit Tests
        run: npm test

      - name: Prepare Web Directory (www)
        run: npm run build:web

      - name: Initialize Android Project & Native Icons
        run: |
          npx cap add android
          npm run assets:native
          npx cap sync android

      - name: Configure Android Metadata & API 36 Check
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: npm run android:configure

      - name: Build Debug APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Archive APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: calc-coffee-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with Staging APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.4.0-apk
          name: "Calc Coffee v2.4.0 (APK Android para Testes)"
          body: |
            ## Calc Coffee — APK Android de Bancada (Staging)

            Este APK foi gerado automaticamente pela esteira de CI/CD do GitHub Actions com Capacitor 8 (Android API 36) e ícones nativos.

            ### Como Instalar no Celular Android:
            1. Baixe o arquivo `app-debug.apk` anexado abaixo diretamente no celular Android.
            2. Toque no arquivo baixado para instalar.
            3. Se o Android exibir o alerta de segurança ("Instalar apps de fontes desconhecidas"), confirme a autorização.
            4. O aplicativo abre nativamente em tela cheia com Wake Lock ativo e guia de áudio.
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
